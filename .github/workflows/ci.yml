name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-secret-key
          DJANGO_DEBUG=1
          POSTGRES_DB=takataka
          POSTGRES_USER=takataka
          POSTGRES_PASSWORD=takataka
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_URL=redis://redis:6379/0
          VITE_API_BASE_URL=http://localhost:8000/api
          EOF

      - name: Build backend
        run: docker compose build backend

      - name: Start database and Redis
        run: docker compose up -d db redis

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready \
              -U takataka \
              -d takataka; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready."
          docker compose logs db
          exit 1

      - name: Django checks
        run: docker compose run --rm backend python manage.py check

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
